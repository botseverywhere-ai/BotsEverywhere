name: ci

on:
  pull_request:
  push:

# The workflow only reads the repository: no write to contents, packages, or pull requests.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate bot catalog
        run: npm run validate:bots
      - name: Auth and team tests
        run: npm test
      - name: Build web and API
        run: npm run build
