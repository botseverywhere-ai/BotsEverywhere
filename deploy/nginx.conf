# botseverywhere.ai on one EC2 box.
# Static files from `dist/` at the site root. The API is proxied under /api.
# Terminate TLS in front of this server (certbot or an existing load balancer)
# and set COOKIE_SECURE=true so the session cookie is marked Secure.
server {
  listen 80;
  server_name botseverywhere.ai www.botseverywhere.ai;
  root /var/www/botseverywhere;
  index index.html;

  location /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 7d;
    add_header Cache-Control "public";
  }
}
